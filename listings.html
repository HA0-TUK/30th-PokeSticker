     crossorigin="anonymous"></script>

  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">포켓몬스터 30주년 로고스티커 교환</p>
        <h1>교환 글 보기</h1>
      </div>
      <nav aria-label="주요 메뉴">
        <a class="nav-link" href="./index.html">마이페이지</a>
        <a class="nav-button active" href="./listings.html">교환 글 보기</a>
      </nav>
    </header>

    <main class="listings-page">
      <section class="panel">
        <div class="section-title">
          <div>
            <h2>교환 글</h2>
            <p>현재 브라우저에 저장된 교환 글입니다. 서버 연결 전까지는 로컬 데모 저장소로 동작합니다.</p>
          </div>
          <button id="resetListingsButton" type="button" class="secondary">게시글 비우기</button>
        </div>
        <div id="listingList" class="listing-list"></div>
        <div id="listingPagination" class="pagination-bar" hidden>
          <p id="listingPaginationSummary"></p>
          <div class="pagination-controls" aria-label="교환 글 페이지">
            <button id="previousListingsPageButton" type="button" class="secondary">이전</button>
            <div id="listingPageButtons" class="page-buttons"></div>
            <button id="nextListingsPageButton" type="button" class="secondary">다음</button>
          </div>
        </div>
      </section>
    </main>

    <div id="imageModal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="첨부 이미지 크게 보기">
      <button id="closeImageModal" type="button" class="modal-close">닫기</button>
      <img id="modalImage" alt="확대된 첨부 이미지" />
    </div>
